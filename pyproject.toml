[project]
name = "echotrace-ai"
version = "1.0.0"
description = "AI Transparency and Trust Analysis Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy>=2.0.30",
    "pydantic>=2.7.1",
    "pydantic-settings>=2.2.1",
    "python-dotenv>=1.0.1",
    "reportlab>=4.2.0"
]

[tool.pyright]
extraPaths = ["backend"]

[tool.pylance]
extraPaths = ["backend"]
